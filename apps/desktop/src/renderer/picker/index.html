<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; style-src 'self'; script-src 'self'" />
  <title>Picker</title>
  <link rel="stylesheet" href="picker.css" />
</head>

<body>
  <p id="hint">Please click on the display you want to capture.</p>
  <div id="toolbar" hidden data-picker-control>
    <span id="region-count"></span>
    <button id="undo" type="button">Undo</button>
    <button id="clear" type="button">Clear this screen</button>
    <button id="apply" type="button">Apply regions</button>
    <button id="cancel" type="button">Cancel</button>
  </div>
  <div id="saved-regions"></div>
  <div id="selection"></div>
  <div id="coords"></div>
  <script src="./picker.js"></script>
</body>

</html>
