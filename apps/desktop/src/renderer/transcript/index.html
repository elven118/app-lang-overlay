<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; style-src 'self'; script-src 'self';" />
  <title>OCR Translation Transcript</title>
  <link rel="stylesheet" href="transcript.css" />
</head>
<body>
  <header>
    <div>
      <h1>OCR Translation Transcript</h1>
      <p>Text and translations only. Captured images are not stored.</p>
    </div>
    <button id="clear-transcript" type="button">Clear view</button>
  </header>
  <main>
    <p id="empty-state">Translations will appear here.</p>
    <div id="entries"></div>
  </main>
  <script src="./transcript.js"></script>
</body>
</html>
