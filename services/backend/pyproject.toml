[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "app-lang-overlay-backend"
version = "0.2.0"
description = "ONNX OCR and translation backend for App Lang Overlay"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
overlay-backend = "overlay_backend.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
